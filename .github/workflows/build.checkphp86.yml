name: Check PHP 8.6 compatibility

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  COMPOSER_NO_AUDIT: "1"
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_PROCESS_TIMEOUT: "0"

jobs:
  checkphp86compatibility:
    name: PHP 8.6 compatibility

    permissions:
      contents: read

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.6"
          tools: composer:v2
          coverage: none
          ini-values: |
            memory_limit=-1
            error_reporting=E_ALL
            display_errors=On
            zend.assertions=1
            assert.exception=1
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          fail-fast: true

      - name: Show PHP environment
        run: |
          php --version
          composer --version
          php --ini
          php -m

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Check dependency resolution for PHP 8.6
        id: dependency-check
        continue-on-error: true
        run: |
          composer update \
            --dry-run \
            --with-all-dependencies \
            --prefer-dist \
            --no-interaction

      - name: Diagnose PHP 8.6 dependency conflicts
        if: ${{ steps.dependency-check.outcome == 'failure' }}
        run: |
          echo "::error::Composer could not resolve all dependencies for PHP 8.6."
          echo
          echo "Packages blocking PHP 8.6:"
          composer prohibits php 8.6 --tree || true
          exit 1

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: "--prefer-dist"
          require-lock-file: false
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Prepare build directories
        run: |
          mkdir -p build/phpstan-cache
          mkdir -p build/phpunit-cache

      - name: Restore quality tools cache
        id: quality-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            build/phpstan-cache
            build/phpunit-cache
          key: ${{ runner.os }}-quality-php-8.6-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-quality-php-8.6-

      - name: Run parallel lint
        run: vendor/bin/parallel-lint src tests

      - name: Run PHPStan
        run: |
          php \
            -d error_reporting=E_ALL \
            -d display_errors=On \
            -d sys_temp_dir="$(pwd)/build/phpstan-cache" \
            vendor/bin/phpstan analyze \
            -c build/phpstan.neon \
            --autoload-file=vendor/autoload.php \
            --no-interaction \
            --memory-limit=4G \
            --error-format=github

      - name: Run PHPUnit tests
        run: |
          php \
            -d error_reporting=E_ALL \
            -d display_errors=On \
            -d zend.assertions=1 \
            -d assert.exception=1 \
            vendor/bin/phpunit \
            --configuration build/phpunit.xml \
            --no-coverage \
            --stop-on-failure

      - name: Save quality tools cache
        if: ${{ !cancelled() && steps.quality-cache-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            build/phpstan-cache
            build/phpunit-cache
          key: ${{ steps.quality-cache-restore.outputs.cache-primary-key }}
