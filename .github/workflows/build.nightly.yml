name: Nightly Build

on:
  schedule:
    - cron: '17 3 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  COMPOSER_NO_AUDIT: "1"
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_PROCESS_TIMEOUT: "0"
  XDEBUG_MODE: off
  KOSIT_REMOTE_HOST: 127.0.0.1
  KOSIT_REMOTE_PORT: "8081"
  VERAPDF_REMOTE_HOST: 127.0.0.1
  VERAPDF_REMOTE_PORT: "8080"

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Determine nightly build metadata
        id: nightly-build
        run: |
          nightlyBuildDate=$(TZ=Europe/Berlin date +%Y-%m-%d)
          nightlyCommitSha=$(git rev-parse HEAD)
          nightlyShortCommitSha=${nightlyCommitSha:0:12}
          nightlyArtifactName="invoicesuite-nightly-$nightlyBuildDate-$nightlyShortCommitSha"
          nightlyPackageFilename="$nightlyArtifactName.zip"
          nightlyChecksumFilename="$nightlyPackageFilename.sha256"

          echo "artifact_name=$nightlyArtifactName" >> "$GITHUB_OUTPUT"
          echo "build_date=$nightlyBuildDate" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$nightlyCommitSha" >> "$GITHUB_OUTPUT"
          echo "short_commit_sha=$nightlyShortCommitSha" >> "$GITHUB_OUTPUT"
          echo "package_filename=$nightlyPackageFilename" >> "$GITHUB_OUTPUT"
          echo "checksum_filename=$nightlyChecksumFilename" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, fileinfo, libxml, mbstring, zip, pcntl, pdo, bcmath, intl, gd, exif, iconv, imagick, json
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=-1
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: false
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Prepare build directories
        run: |
          mkdir -p build/dist
          mkdir -p build/phpcsfixer-cache
          mkdir -p build/phpstan-cache
          mkdir -p build/phpunit-cache

      - name: Run parallel lint
        run: vendor/bin/parallel-lint src tests

      - name: Restore quality tools cache
        id: quality-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            build/phpcsfixer-cache
            build/phpstan-cache
            build/phpunit-cache
          key: ${{ runner.os }}-quality-php-8.5-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-quality-php-8.5-

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --config=build/phpcsfixer.php --dry-run --no-interaction

      - name: Run PHPStan
        run: php -d sys_temp_dir=$(pwd)/build/phpstan-cache vendor/bin/phpstan analyze -c build/phpstan.neon --autoload-file=vendor/autoload.php --no-interaction --memory-limit 4G --error-format=github

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --stop-on-failure --configuration build/phpunit.xml --no-coverage

      - name: Save quality tools cache
        if: ${{ !cancelled() && steps.quality-cache-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            build/phpcsfixer-cache
            build/phpstan-cache
            build/phpunit-cache
          key: ${{ steps.quality-cache-restore.outputs.cache-primary-key }}
      - name: Start validation services
        run: docker compose --file .github/services/compose.yml up --detach --quiet-pull --wait --wait-timeout 120

      - name: Run remote Schematron tests
        run: |
          expectedResultAnchor='<rep:assessment><rep:accept>'

          for invoiceXmlFilename in \
            tests/assets/00_case_comfort_simple.xml \
            tests/assets/00_case_comfort_simple_dto.xml \
            tests/assets/00_case_xrechnung_cii_simple.xml \
            tests/assets/00_case_xrechnung_cii_simple_dto.xml \
            tests/assets/00_case_xrechnung_ublinvoice_simple.xml \
            tests/assets/00_case_xrechnung_ublinvoice_simple_dto.xml \
            tests/assets/00_case_xrechnung_ublcreditnote_simple.xml \
            tests/assets/00_case_xrechnung_ublcreditnote_simple_dto.xml
          do
            if ! kositValidationResult=$(curl \
              --silent \
              --show-error \
              --header 'Content-Type: application/xml' \
              --data-binary "@$invoiceXmlFilename" \
              --max-time 120 \
              --write-out $'\n%{http_code}' \
              "http://$KOSIT_REMOTE_HOST:$KOSIT_REMOTE_PORT/${invoiceXmlFilename##*/}")
            then
              echo "KoSIT validation request failed for $invoiceXmlFilename." >&2
              exit 1
            fi

            if [ "${kositValidationResult##*$'\n'}" != '200' ] ||
              [[ "${kositValidationResult%$'\n'*}" != *"$expectedResultAnchor"* ]]
            then
              echo "KoSIT returned an unexpected result for $invoiceXmlFilename." >&2
              exit 1
            fi
          done

          echo 'Remote Schematron tests passed.'

      - name: Run negative remote Schematron tests
        run: |
          expectedResultAnchor='<rep:assessment><rep:reject>'
          unexpectedResultAnchor='<rep:assessment><rep:accept>'

          for invalidInvoiceXmlFilename in tests/assets/*technical*.xml
          do
            if ! kositValidationResult=$(curl \
              --silent \
              --show-error \
              --header 'Content-Type: application/xml' \
              --data-binary "@$invalidInvoiceXmlFilename" \
              --max-time 120 \
              --write-out $'\n%{http_code}' \
              "http://$KOSIT_REMOTE_HOST:$KOSIT_REMOTE_PORT/${invalidInvoiceXmlFilename##*/}")
            then
              echo "KoSIT validation request failed for $invalidInvoiceXmlFilename." >&2
              exit 1
            fi

            if [ "${kositValidationResult##*$'\n'}" != '406' ] ||
              [[ "${kositValidationResult%$'\n'*}" != *"$expectedResultAnchor"* ]] ||
              [[ "${kositValidationResult%$'\n'*}" == *"$unexpectedResultAnchor"* ]]
            then
              echo "KoSIT returned an unexpected result for $invalidInvoiceXmlFilename." >&2
              exit 1
            fi
          done

          echo 'Negative remote Schematron tests passed.'

      - name: Run remote veraPDF tests
        run: |
          expectedResultAnchor='<validationReports compliant="1" nonCompliant="0" failedJobs="0">1</validationReports>'

          for pdfFilename in \
            tests/assets/00_case_comfort_simple.pdf \
            tests/assets/00_case_extended_simple.pdf
          do
            if ! veraPdfValidationResult=$(curl \
              --silent \
              --show-error \
              --header 'Accept: application/xml' \
              --form "file=@$pdfFilename;type=application/pdf" \
              --max-time 120 \
              --write-out $'\n%{http_code}' \
              "http://$VERAPDF_REMOTE_HOST:$VERAPDF_REMOTE_PORT/api/validate/3b")
            then
              echo "veraPDF validation request failed for $pdfFilename." >&2
              exit 1
            fi

            if [ "${veraPdfValidationResult##*$'\n'}" != '200' ] ||
              [[ "${veraPdfValidationResult%$'\n'*}" != *"$expectedResultAnchor"* ]]
            then
              echo "veraPDF returned an unexpected result for $pdfFilename." >&2
              exit 1
            fi
          done

          echo 'Remote veraPDF tests passed.'

      - name: Run negative remote veraPDF tests
        run: |
          unexpectedResultAnchor='<validationReports compliant="1" nonCompliant="0" failedJobs="0">1</validationReports>'

          for validationCase in \
            'tests/assets/pdf_plain.pdf|<validationReports compliant="0" nonCompliant="1" failedJobs="0">1</validationReports>' \
            'tests/assets/pdf_broken.pdf|<validationReports compliant="0" nonCompliant="0" failedJobs="1">1</validationReports>'
          do
            invalidPdfFilename="${validationCase%%|*}"
            expectedResultAnchor="${validationCase#*|}"

            if ! veraPdfValidationResult=$(curl \
              --silent \
              --show-error \
              --header 'Accept: application/xml' \
              --form "file=@$invalidPdfFilename;type=application/pdf" \
              --max-time 120 \
              --write-out $'\n%{http_code}' \
              "http://$VERAPDF_REMOTE_HOST:$VERAPDF_REMOTE_PORT/api/validate/3b")
            then
              echo "veraPDF validation request failed for $invalidPdfFilename." >&2
              exit 1
            fi

            if [ "${veraPdfValidationResult##*$'\n'}" != '200' ] ||
              [[ "${veraPdfValidationResult%$'\n'*}" != *"$expectedResultAnchor"* ]] ||
              [[ "${veraPdfValidationResult%$'\n'*}" == *"$unexpectedResultAnchor"* ]]
            then
              echo "veraPDF returned an unexpected result for $invalidPdfFilename." >&2
              exit 1
            fi
          done

          echo 'Negative remote veraPDF tests passed.'

      - name: Create nightly package
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
          NIGHTLY_BUILD_DATE: ${{ steps.nightly-build.outputs.build_date }}
          NIGHTLY_CHECKSUM_FILENAME: ${{ steps.nightly-build.outputs.checksum_filename }}
          NIGHTLY_COMMIT_SHA: ${{ steps.nightly-build.outputs.commit_sha }}
          NIGHTLY_PACKAGE_FILENAME: ${{ steps.nightly-build.outputs.package_filename }}
        run: |
          nightlyPackageDirectory=build/nightly/invoicesuite

          mkdir -p "$nightlyPackageDirectory"
          git archive HEAD | tar -x -C "$nightlyPackageDirectory"

          {
            echo 'InvoiceSuite nightly build'
            echo "Build date: $NIGHTLY_BUILD_DATE"
            echo "Commit: $NIGHTLY_COMMIT_SHA"
            echo 'Warning: This is an unstable development snapshot.'
          } > "$nightlyPackageDirectory/NIGHTLY-BUILD.txt"

          composer install \
            --working-dir="$nightlyPackageDirectory" \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-progress

          (
            cd build/nightly
            zip -q -r "../dist/$NIGHTLY_PACKAGE_FILENAME" invoicesuite
          )

          (
            cd build/dist
            sha256sum "$NIGHTLY_PACKAGE_FILENAME" > "$NIGHTLY_CHECKSUM_FILENAME"
          )

      - name: Upload nightly build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.nightly-build.outputs.artifact_name }}
          path: |
            build/dist/${{ steps.nightly-build.outputs.package_filename }}
            build/dist/${{ steps.nightly-build.outputs.checksum_filename }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
