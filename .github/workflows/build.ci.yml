name: Continuous Integration

on:
  push:
    tags-ignore:
      - "**"
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - ".github/**"
      - "examples/**"
      - "make/**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  COMPOSER_NO_AUDIT: "1"
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_PROCESS_TIMEOUT: "0"
  XDEBUG_MODE: off
  KOSIT_REMOTE_HOST: 127.0.0.1
  KOSIT_REMOTE_PORT: "8081"
  VERAPDF_REMOTE_HOST: 127.0.0.1
  VERAPDF_REMOTE_PORT: "8080"

jobs:
  build:
    permissions:
      contents: read
      checks: write
      pull-requests: write
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-24.04]
        phpversion: ['8.2', '8.3', '8.4', '8.5']
    services:
      kosit-validator:
        image: apps4everything/kosit-validator-xrechnung:3.0.2-2@sha256:8cee7d3b246725ac365fd2f13483d14a01f547f7a513a7c6bb298fc0ab243383
        ports:
          - 8081:8081
      verapdf-validator:
        image: verapdf/rest:v1.30.2@sha256:341359ac6af558f35f03c355a798fec57ba049dd04f0a503f300170e1696573b
        ports:
          - 8080:8080
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8080/api/info || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.phpversion }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, bcmath, intl, gd, exif, iconv, imagick, json, xdebug
          tools: composer:v2
          coverage: xdebug
          ini-values: memory_limit=-1
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: false
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Prepare build directories
        run: |
          mkdir -p build/builddoc
          mkdir -p build/coverage
          mkdir -p build/coverage-html
          mkdir -p build/dist
          mkdir -p build/logs
          mkdir -p build/phpdoc
          mkdir -p build/phpstan

      - name: Run parallel lint
        run: vendor/bin/parallel-lint src tests

      - name: Cache PHP-CS-Fixer
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: build/.php-cs-fixer.cache
          key: ${{ runner.os }}-php-cs-fixer-php-${{ matrix.phpversion }}-${{ hashFiles('build/phpcsfixer.php', 'composer.lock') }}

      - name: Cache PHPStan
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: build/phpstan
          key: ${{ runner.os }}-phpstan-php-${{ matrix.phpversion }}-${{ hashFiles('build/phpstan.neon', 'composer.lock') }}

      - name: Run PHP-CS-Fixer
        env:
          XDEBUG_MODE: off
        run: vendor/bin/php-cs-fixer fix --config=build/phpcsfixer.php --dry-run --no-interaction

      - name: Run PHPStan
        run: php -d sys_temp_dir=$(pwd)/build/phpstan vendor/bin/phpstan analyze -c build/phpstan.neon --autoload-file=vendor/autoload.php --no-interaction --memory-limit 4G --error-format=github

      - name: Run PHPUnit tests
        env:
          XDEBUG_MODE: coverage
        run: vendor/bin/phpunit --stop-on-failure --configuration build/phpunit.xml

      - name: Run remote Schematron tests
        run: |
          kositValidationReportFilename="$RUNNER_TEMP/kosit-validation-report.xml"

          for invoiceXmlFilename in \
            tests/assets/00_case_comfort_simple.xml \
            tests/assets/00_case_comfort_simple_dto.xml \
            tests/assets/00_case_xrechnung_cii_simple.xml \
            tests/assets/00_case_xrechnung_cii_simple_dto.xml \
            tests/assets/00_case_xrechnung_ublinvoice_simple.xml \
            tests/assets/00_case_xrechnung_ublinvoice_simple_dto.xml \
            tests/assets/00_case_xrechnung_ublcreditnote_simple.xml \
            tests/assets/00_case_xrechnung_ublcreditnote_simple_dto.xml
          do
            if ! kositHttpStatusCode=$(curl \
              --silent \
              --show-error \
              --header 'Content-Type: application/xml' \
              --data-binary "@$invoiceXmlFilename" \
              --max-time 120 \
              --output "$kositValidationReportFilename" \
              --write-out '%{http_code}' \
              "http://$KOSIT_REMOTE_HOST:$KOSIT_REMOTE_PORT/${invoiceXmlFilename##*/}")
            then
              echo "KoSIT validation request failed for $invoiceXmlFilename." >&2
              exit 1
            fi

            if [ "$kositHttpStatusCode" != '200' ]
            then
              echo "KoSIT validation failed for $invoiceXmlFilename (HTTP $kositHttpStatusCode)." >&2
              exit 1
            fi

            if ! grep --fixed-strings --quiet '<rep:assessment><rep:accept>' "$kositValidationReportFilename"
            then
              echo "KoSIT returned no acceptance result for $invoiceXmlFilename." >&2
              exit 1
            fi

            echo "KoSIT validation passed for $invoiceXmlFilename."
          done

      - name: Run negative remote Schematron tests
        run: |
          kositRejectionReportFilename="$RUNNER_TEMP/kosit-rejection-report.xml"

          for invalidInvoiceXmlFilename in tests/assets/*technical*.xml
          do
            if ! kositHttpStatusCode=$(curl \
              --silent \
              --show-error \
              --header 'Content-Type: application/xml' \
              --data-binary "@$invalidInvoiceXmlFilename" \
              --max-time 120 \
              --output "$kositRejectionReportFilename" \
              --write-out '%{http_code}' \
              "http://$KOSIT_REMOTE_HOST:$KOSIT_REMOTE_PORT/${invalidInvoiceXmlFilename##*/}")
            then
              echo "KoSIT validation request failed for $invalidInvoiceXmlFilename." >&2
              exit 1
            fi

            if [ "$kositHttpStatusCode" != '406' ]
            then
              echo "KoSIT did not reject $invalidInvoiceXmlFilename as expected (HTTP $kositHttpStatusCode)." >&2
              exit 1
            fi

            if ! grep --fixed-strings --quiet '<rep:assessment><rep:reject>' "$kositRejectionReportFilename"
            then
              echo "KoSIT returned no rejection result for $invalidInvoiceXmlFilename." >&2
              exit 1
            fi

            if grep --fixed-strings --quiet '<rep:assessment><rep:accept>' "$kositRejectionReportFilename"
            then
              echo "KoSIT unexpectedly accepted $invalidInvoiceXmlFilename." >&2
              exit 1
            fi

            echo "KoSIT validation rejected $invalidInvoiceXmlFilename as expected."
          done

      - name: Run remote veraPDF tests
        run: |
          veraPdfValidationReportFilename="$RUNNER_TEMP/verapdf-validation-report.xml"

          for pdfFilename in \
            tests/assets/00_case_comfort_simple.pdf \
            tests/assets/00_case_extended_simple.pdf
          do
            if ! veraPdfHttpStatusCode=$(curl \
              --silent \
              --show-error \
              --header 'Accept: application/xml' \
              --form "file=@$pdfFilename;type=application/pdf" \
              --max-time 120 \
              --output "$veraPdfValidationReportFilename" \
              --write-out '%{http_code}' \
              "http://$VERAPDF_REMOTE_HOST:$VERAPDF_REMOTE_PORT/api/validate/3b")
            then
              echo "veraPDF validation request failed for $pdfFilename." >&2
              exit 1
            fi

            if [ "$veraPdfHttpStatusCode" != '200' ]
            then
              echo "veraPDF validation failed for $pdfFilename (HTTP $veraPdfHttpStatusCode)." >&2
              exit 1
            fi

            if ! grep --fixed-strings --quiet '<validationReports compliant="1" nonCompliant="0" failedJobs="0">1</validationReports>' "$veraPdfValidationReportFilename"
            then
              echo "veraPDF returned no compliant validation result for $pdfFilename." >&2
              exit 1
            fi

            echo "veraPDF validation passed for $pdfFilename."
          done

      - name: Publish unit test results
        continue-on-error: true
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: build/logs/junit.xml
          comment_mode: ${{ github.event_name == 'pull_request' && 'failures' || 'always' }}

      - name: Publish coverage summary
        continue-on-error: true
        if: always()
        run: php make/genbuildcoveragesummary.php --summary-file="$GITHUB_STEP_SUMMARY" --clover-file="build/logs/clover.xml" --crap4j-file="build/logs/crap4j.xml"

      - name: Generate SBOM
        continue-on-error: true
        run: |
          composer global config --no-plugins allow-plugins.cyclonedx/cyclonedx-php-composer true
          composer global require --no-interaction --no-progress cyclonedx/cyclonedx-php-composer
          composer CycloneDX:make-sbom --omit=dev --output-format=JSON --output-file=build/dist/sbom.json
          composer CycloneDX:make-sbom --omit=dev --output-format=XML --output-file=build/dist/sbom.xml

      - name: Publish SBOM artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: SBOM artifacts for ${{ matrix.operating-system }} PHP ${{ matrix.phpversion }}
          path: |
            build/dist/sbom.json
            build/dist/sbom.xml
          if-no-files-found: error

      - name: Publish build log artifacts
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Build log artifacts for ${{ matrix.operating-system }} PHP ${{ matrix.phpversion }}
          path: build/logs
          if-no-files-found: error

  ci-success:
    name: CI success
    needs:
      - build
    if: ${{ always() }}
    runs-on: ubuntu-24.04

    steps:
      - name: Verify CI result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "Matrix build result: $BUILD_RESULT"

          if [ "$BUILD_RESULT" != "success" ]; then
            echo "At least one CI matrix job failed or was cancelled."
            exit 1
          fi

          echo "All CI matrix jobs passed."
