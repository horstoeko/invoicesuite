services:
  kosit-validator:
    image: apps4everything/kosit-validator-xrechnung:3.0.2-2
    ports:
      - '8081:8081'

  verapdf-validator:
    image: verapdf/rest:v1.30.2
    ports:
      - '8080:8080'
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --output-document=/dev/null http://127.0.0.1:8080/api/info || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
